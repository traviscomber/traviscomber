      <text x="0" y="-31" fill="#91A6A2" font-size="11" text-anchor="middle">DOMAIN SYSTEMS</text>
      <text x="0" y="-15" fill="#586F6B" font-size="10" text-anchor="middle">EcoSuelo · N3uralia · LABBE</text>
    </g>
