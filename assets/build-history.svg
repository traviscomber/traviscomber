      <text x="0" y="-31" fill="#91A6A2" font-size="11" text-anchor="middle">SHARED OPERATIONAL MODELS</text>
      <text x="0" y="-15" fill="#586F6B" font-size="10" text-anchor="middle">Cort3x · Black Swan</text>
