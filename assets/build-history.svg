<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">N3uralia Project Origin Timeline 2025–2026</title>
  <desc id="desc">Timeline based on earliest verified project lineage, separating project origins from later repository rebuilds and documentation updates.</desc>
  <rect width="1200" height="270" fill="#0B0F10"/>
